openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: BSV DEX Exchange API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: markets
    description: Market data and trading pairs
  - name: orderbook
    description: Order book operations
  - name: orders
    description: Order management
  - name: trades
    description: Trade history
  - name: wallet
    description: Wallet operations
  - name: portfolio
    description: Portfolio and balances
  - name: futures
    description: Futures/perpetuals trading
  - name: candles
    description: OHLCV candlestick data
  - name: anthropic
    description: Anthropic AI chat operations

paths:
  /ai/status:
    get:
      operationId: getOraInsightsRuntime
      tags: [anthropic]
      summary: Selected Ora insights provider and model readiness on this API runtime
      responses:
        "200":
          description: Runtime readiness, not a guarantee of successful inference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiRuntimeStatus"
  /anthropic/status:
    get:
      operationId: getOraChatRuntime
      tags: [anthropic]
      summary: Selected Ora chat provider and model readiness on this API runtime
      responses:
        "200":
          description: Runtime readiness, not a guarantee of successful inference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiRuntimeStatus"
  /admin/devai/status:
    get:
      operationId: getDevAiRuntime
      tags: [anthropic]
      summary: Admin-only DevAI runtime readiness and installed model tags
      responses:
        "200":
          description: Authenticated runtime readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiRuntimeStatus"
        "401":
          description: Admin authentication required
  /anthropic/conversations:
    get:
      operationId: listAnthropicConversations
      tags: [anthropic]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicConversation"
    post:
      operationId: createAnthropicConversation
      tags: [anthropic]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversation"
  /anthropic/conversations/{id}:
    get:
      operationId: getAnthropicConversation
      tags: [anthropic]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
    delete:
      operationId: deleteAnthropicConversation
      tags: [anthropic]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
  /anthropic/conversations/{id}/messages:
    get:
      operationId: listAnthropicMessages
      tags: [anthropic]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicMessage"
    post:
      operationId: sendAnthropicMessage
      tags: [anthropic]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicMessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /markets:
    get:
      operationId: getMarkets
      tags: [markets]
      summary: Get all trading pairs/markets
      responses:
        "200":
          description: List of markets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Market"

  /markets/{symbol}:
    get:
      operationId: getMarket
      tags: [markets]
      summary: Get a single market
      parameters:
        - in: path
          name: symbol
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Market details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Market"

  /markets/{symbol}/ticker:
    get:
      operationId: getTicker
      tags: [markets]
      summary: Get 24h ticker for a market
      parameters:
        - in: path
          name: symbol
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ticker data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticker"

  /markets/{symbol}/candles:
    get:
      operationId: getCandles
      tags: [candles]
      summary: Get OHLCV candlestick data
      parameters:
        - in: path
          name: symbol
          required: true
          schema:
            type: string
        - in: query
          name: interval
          schema:
            type: string
            enum: [1m, 5m, 15m, 1h, 4h, 1d, 1w]
            default: 1h
        - in: query
          name: limit
          schema:
            type: integer
            default: 200
      responses:
        "200":
          description: Candlestick data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Candle"

  /markets/{symbol}/orderbook:
    get:
      operationId: getOrderBook
      tags: [orderbook]
      summary: Get order book for a market
      parameters:
        - in: path
          name: symbol
          required: true
          schema:
            type: string
        - in: query
          name: depth
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Order book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBook"

  /markets/{symbol}/trades:
    get:
      operationId: getRecentTrades
      tags: [trades]
      summary: Get recent trades for a market
      parameters:
        - in: path
          name: symbol
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Recent trades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"

  /orders:
    get:
      operationId: getOrders
      tags: [orders]
      summary: Get user orders
      parameters:
        - in: query
          name: walletAddress
          required: true
          schema:
            type: string
        - in: query
          name: symbol
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [open, filled, cancelled, partial]
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: User orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: placeOrder
      tags: [orders]
      summary: Place a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrderRequest"
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order by ID
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    delete:
      operationId: cancelOrder
      tags: [orders]
      summary: Cancel an order
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrderRequest"
      responses:
        "200":
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /trades/history:
    get:
      operationId: getTradeHistory
      tags: [trades]
      summary: Get user trade history
      parameters:
        - in: query
          name: walletAddress
          required: true
          schema:
            type: string
        - in: query
          name: symbol
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Trade history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"

  /explorer/blocks:
    get:
      operationId: getExplorerBlocks
      tags: [explorer]
      summary: Get recent BSV blocks
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 8
      responses:
        "200":
          description: Recent BSV block summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplorerBlocksResponse"

  /explorer/block/{height}:
    get:
      operationId: getExplorerBlock
      tags: [explorer]
      summary: Get a BSV block and a page of its transaction IDs
      parameters:
        - in: path
          name: height
          required: true
          schema:
            type: integer
            minimum: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Block details and paginated transaction IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplorerBlockTransactions"

  /explorer/tx/{txid}:
    get:
      operationId: getExplorerTransaction
      tags: [explorer]
      summary: Look up a BSV transaction by ID
      parameters:
        - in: path
          name: txid
          required: true
          schema:
            type: string
            pattern: "^[a-fA-F0-9]{64}$"
      responses:
        "200":
          description: BSV transaction details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplorerTransaction"

  /explorer/address/{address}/history:
    get:
      operationId: getExplorerAddressHistory
      tags: [explorer]
      summary: Get confirmed transactions for a BSV address
      parameters:
        - in: path
          name: address
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
        - in: query
          name: token
          schema:
            type: string
      responses:
        "200":
          description: Paginated confirmed address history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplorerAddressHistory"

  /explorer/activity:
    get:
      operationId: getExplorerActivity
      tags: [explorer]
      summary: Get recent public OrahDEX exchange activity
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated exchange activity with private address fields omitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplorerActivityPage"

  /portfolio:
    get:
      operationId: getPortfolio
      tags: [portfolio]
      summary: Get user portfolio/balances
      parameters:
        - in: query
          name: walletAddress
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Portfolio data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"

  /futures/positions:
    get:
      operationId: getFuturesPositions
      tags: [futures]
      summary: Get user futures positions
      parameters:
        - in: query
          name: walletAddress
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Futures positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FuturesPosition"
    post:
      operationId: openFuturesPosition
      tags: [futures]
      summary: Open a futures position
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenFuturesPositionRequest"
      responses:
        "201":
          description: Position opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuturesPosition"

  /futures/positions/{positionId}:
    delete:
      operationId: closeFuturesPosition
      tags: [futures]
      summary: Close a futures position
      parameters:
        - in: path
          name: positionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseFuturesPositionRequest"
      responses:
        "200":
          description: Position closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuturesPosition"

  /futures/funding-rates:
    get:
      operationId: getFundingRates
      tags: [futures]
      summary: Get funding rates for futures markets
      responses:
        "200":
          description: Funding rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FundingRate"

  /wallet/connect:
    post:
      operationId: connectWallet
      tags: [wallet]
      summary: Register wallet connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectWalletRequest"
      responses:
        "200":
          description: Wallet connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSession"

  /wallet/transactions:
    get:
      operationId: getWalletTransactions
      tags: [wallet]
      summary: Get wallet on-chain transactions
      parameters:
        - in: query
          name: walletAddress
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Wallet transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WalletTransaction"

components:
  schemas:
    AiRuntimeStatus:
      type: object
      required: [provider, model, environment, ready, code, error]
      properties:
        provider:
          type: string
          enum: [local_ollama, openai, anthropic]
        model:
          type: string
        environment:
          type: string
        ready:
          type: boolean
        code:
          type: string
        error:
          type: [string, "null"]
        enabled:
          type: boolean
        reachable:
          type: boolean
        modelAvailable:
          type: boolean
        availableModels:
          type: array
          items:
            type: string
        minimumModelHeadroomBytes:
          type: number
        requiredInferenceHeadroomBytes:
          type: number
          description: Additional free host memory required for this exact model, including the API reserve.
        residentModelBytes:
          type: number
          description: Verified reusable CPU memory of the exact selected Ollama runner.
        memory:
          type: [object, "null"]
          required: [availableBytes, limitBytes]
          properties:
            availableBytes:
              type: number
            limitBytes:
              type: number
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [starting, ok, degraded, outage, unknown]
        uptime:
          type: integer
          minimum: 0
        timestamp:
          type: string
          format: date-time
        services:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
                enum: [healthy, degraded, stuck, dead, starting]
              lastRunAt:
                type: [string, "null"]
                format: date-time
              lastSuccessAt:
                type: [string, "null"]
                format: date-time
              consecutiveFails:
                type: integer
                minimum: 0
              avgDurationMs:
                type: integer
                minimum: 0
              staleSinceMs:
                type: [integer, "null"]
                minimum: 0
            required:
              - name
              - status
              - lastRunAt
              - lastSuccessAt
              - consecutiveFails
              - avgDurationMs
              - staleSinceMs
        alerts:
          type: array
          items:
            type: string
      required:
        - status
        - uptime
        - timestamp
        - services
        - alerts

    Market:
      type: object
      properties:
        symbol:
          type: string
          example: "BSV/USDT"
        baseAsset:
          type: string
          example: "BSV"
        quoteAsset:
          type: string
          example: "USDT"
        lastPrice:
          type: number
        priceChange24h:
          type: number
        priceChangePercent24h:
          type: number
        volume24h:
          type: number
        high24h:
          type: number
        low24h:
          type: number
        marketCap:
          type: number
        status:
          type: string
          enum: [active, suspended, delisted]
        type:
          type: string
          enum: [spot, futures]
        minOrderSize:
          type: number
        maxOrderSize:
          type: number
        tickSize:
          type: number
        makerFee:
          type: number
        takerFee:
          type: number
      required:
        - symbol
        - baseAsset
        - quoteAsset
        - lastPrice
        - priceChange24h
        - priceChangePercent24h
        - volume24h
        - high24h
        - low24h
        - status
        - type
        - makerFee
        - takerFee

    Ticker:
      type: object
      properties:
        symbol:
          type: string
        lastPrice:
          type: number
        bidPrice:
          type: number
        askPrice:
          type: number
        openPrice:
          type: number
        highPrice:
          type: number
        lowPrice:
          type: number
        volume:
          type: number
        quoteVolume:
          type: number
        priceChange:
          type: number
        priceChangePercent:
          type: number
        timestamp:
          type: string
          format: date-time
      required:
        - symbol
        - lastPrice
        - bidPrice
        - askPrice
        - openPrice
        - highPrice
        - lowPrice
        - volume
        - priceChange
        - priceChangePercent
        - timestamp

    Candle:
      type: object
      properties:
        time:
          type: number
          description: Unix timestamp in seconds
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: number
      required:
        - time
        - open
        - high
        - low
        - close
        - volume

    OrderBookEntry:
      type: object
      properties:
        price:
          type: number
        quantity:
          type: number
        total:
          type: number
      required:
        - price
        - quantity
        - total

    OrderBook:
      type: object
      properties:
        symbol:
          type: string
        bids:
          type: array
          items:
            $ref: "#/components/schemas/OrderBookEntry"
        asks:
          type: array
          items:
            $ref: "#/components/schemas/OrderBookEntry"
        lastUpdateTime:
          type: string
          format: date-time
      required:
        - symbol
        - bids
        - asks
        - lastUpdateTime

    Trade:
      type: object
      properties:
        id:
          type: string
        symbol:
          type: string
        side:
          type: string
          enum: [buy, sell]
        price:
          type: number
        quantity:
          type: number
        total:
          type: number
        fee:
          type: number
        feeAsset:
          type: string
        timestamp:
          type: string
          format: date-time
        txid:
          type: string
          description: BSV on-chain transaction ID
        walletAddress:
          type: string
      required:
        - id
        - symbol
        - side
        - price
        - quantity
        - total
        - fee
        - feeAsset
        - timestamp

    Order:
      type: object
      properties:
        id:
          type: string
        symbol:
          type: string
        walletAddress:
          type: string
        side:
          type: string
          enum: [buy, sell]
        type:
          type: string
          enum: [limit, market, stop_limit, stop_market, take_profit, oco]
        status:
          type: string
          enum: [open, filled, cancelled, partial, expired]
        price:
          type: number
        stopPrice:
          type: number
        quantity:
          type: number
        filledQuantity:
          type: number
        remainingQuantity:
          type: number
        total:
          type: number
        fee:
          type: number
        feeAsset:
          type: string
        timeInForce:
          type: string
          enum: [GTC, IOC, FOK, GTD]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        txid:
          type: string
        signedTx:
          type: string
          description: BSV signed transaction hex
      required:
        - id
        - symbol
        - walletAddress
        - side
        - type
        - status
        - quantity
        - filledQuantity
        - remainingQuantity
        - fee
        - feeAsset
        - timeInForce
        - createdAt
        - updatedAt

    PlaceOrderRequest:
      type: object
      properties:
        symbol:
          type: string
        walletAddress:
          type: string
        side:
          type: string
          enum: [buy, sell]
        type:
          type: string
          enum: [limit, market, stop_limit, stop_market, take_profit, oco]
        price:
          type: number
        stopPrice:
          type: number
        quantity:
          type: number
        timeInForce:
          type: string
          enum: [GTC, IOC, FOK, GTD]
          default: GTC
        signedTx:
          type: string
          description: BSV signed transaction hex for on-chain settlement
      required:
        - symbol
        - walletAddress
        - side
        - type
        - quantity

    CancelOrderRequest:
      type: object
      properties:
        walletAddress:
          type: string
        signedTx:
          type: string
      required:
        - walletAddress

    Portfolio:
      type: object
      properties:
        walletAddress:
          type: string
        totalValueUSD:
          type: number
        totalPnlUSD:
          type: number
        totalPnlPercent:
          type: number
        balances:
          type: array
          items:
            $ref: "#/components/schemas/AssetBalance"
        openOrdersCount:
          type: integer
        openPositionsCount:
          type: integer
      required:
        - walletAddress
        - totalValueUSD
        - totalPnlUSD
        - totalPnlPercent
        - balances
        - openOrdersCount
        - openPositionsCount

    AssetBalance:
      type: object
      properties:
        asset:
          type: string
        free:
          type: number
        locked:
          type: number
        total:
          type: number
        valueUSD:
          type: number
        pnl24h:
          type: number
        pnl24hPercent:
          type: number
      required:
        - asset
        - free
        - locked
        - total
        - valueUSD

    FuturesPosition:
      type: object
      properties:
        id:
          type: string
        walletAddress:
          type: string
        symbol:
