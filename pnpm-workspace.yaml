packages:
  - 'worker'
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

allowBuilds:
  '@reown/appkit': true
  '@stellar/stellar-sdk': true
  bigint-buffer: true
  blake-hash: true
  bufferutil: true
  esbuild: true
  hyperliquid: true
  keccak: true
  protobufjs: true
  secp256k1: true
  sharp: set this to true or false
  tiny-secp256k1: true
  usb: false
  utf-8-validate: true
  workerd: set this to true or false

autoInstallPeers: false

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.1
  '@replit/vite-plugin-dev-banner': ^0.1.2
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.2.2
  '@tanstack/react-query': 5.96.1
  '@types/node': ^25.5.0
  '@types/react': ^19.2.14
  '@types/react-dom': ^19.2.3
  '@vitejs/plugin-react': ^6.0.1
  class-variance-authority: ^0.7.1
  clsx: 2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: 12.38.0
  lucide-react: ^1.7.0
  react: 19.2.4
  react-dom: 19.2.4
  tailwind-merge: 3.5.0
  tailwindcss: ^4.2.2
  tsx: ^4.21.0
  vite: ^8.1.0
  zod: ^4.3.6

minimumReleaseAge: 0

minimumReleaseAgeExclude:
  - '@replit/*'
  - stripe-replit-sync

dangerouslyAllowAllBuilds: true
