name: ci-cd

on:
  pull_request:
  push:
    branches: [Main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

jobs:
  # -------------------------------------------------------------------------
  # 1. Verify the full monorepo (typecheck, build, test)
  # -------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test --if-present

  # -------------------------------------------------------------------------
  # 2. Verify the exchange worker + dry-run deploy
  # -------------------------------------------------------------------------
  verify-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - name: Install worker dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck worker
        run: pnpm run typecheck

      # Secrets are unavailable on PRs from forks — gate the authenticated dry-run.
      - name: Validate wrangler config (dry-run)
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: npx wrangler deploy --dry-run --outdir /tmp/wrangler-dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # -------------------------------------------------------------------------
  # 3. Deploy staging: migrate -> deploy worker -> smoke test
  # -------------------------------------------------------------------------
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/Main'
    needs: [verify, verify-worker]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - name: Install worker dependencies
        working-directory: worker
        run: pnpm install --frozen-lockfile

      - name: Run migrations (staging)
        working-directory: worker
        run: node scripts/migrate.mjs
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Sync secrets to staging worker
        working-directory: worker
        run: |
          set -euo pipefail
          sync_secret() {
            local name="$1" value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --env staging --name orahdex-exchange-staging
            fi
          }
          sync_secret EVM_WEBHOOK_SECRET    "${{ secrets.EVM_WEBHOOK_SECRET }}"
          sync_secret STRIPE_WEBHOOK_SECRET "${{ secrets.STRIPE_WEBHOOK_SECRET }}"
          sync_secret EXCHANGE_HOT_WALLET_KEY "${{ secrets.EXCHANGE_HOT_WALLET_KEY }}"
          sync_secret EVM_RELAYER_KEY       "${{ secrets.EVM_RELAYER_KEY }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy staging worker
        working-directory: worker
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test staging
        run: |
          for i in $(seq 1 10); do
            status=$(curl -s -o /tmp/health.json -w "%{http_code}" \
              "${{ secrets.STAGING_HEALTH_URL }}" || true)
            if [ "$status" = "200" ]; then cat /tmp/health.json; exit 0; fi
            sleep 10
          done
          echo "Staging health check failed"; exit 1

  # -------------------------------------------------------------------------
  # 4. Deploy production: migrate -> deploy worker -> deploy Pages
  # -------------------------------------------------------------------------
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/Main'
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # --- worker ---
      - name: Install worker dependencies
        working-directory: worker
        run: pnpm install --frozen-lockfile

      - name: Run migrations (production)
        working-directory: worker
        run: node scripts/migrate.mjs
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Sync secrets to production worker
        working-directory: worker
        run: |
          set -euo pipefail
          sync_secret() {
            local name="$1" value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --env production --name orahdex-exchange
            fi
          }
          sync_secret EVM_WEBHOOK_SECRET    "${{ secrets.EVM_WEBHOOK_SECRET }}"
          sync_secret STRIPE_WEBHOOK_SECRET "${{ secrets.STRIPE_WEBHOOK_SECRET }}"
          sync_secret EXCHANGE_HOT_WALLET_KEY "${{ secrets.EXCHANGE_HOT_WALLET_KEY }}"
          sync_secret EVM_RELAYER_KEY       "${{ secrets.EVM_RELAYER_KEY }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy production worker
        working-directory: worker
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test production worker
        run: |
          url="${{ secrets.PROD_HEALTH_URL }}"
          for i in $(seq 1 10); do
            status=$(curl -s -o /tmp/health.json -w "%{http_code}" "$url" || true)
            if [ "$status" = "200" ]; then cat /tmp/health.json; exit 0; fi
            sleep 10
          done
          echo "Production health check failed"; exit 1

      # --- frontend (Pages) ---
      - name: Build frontend
        run: pnpm install --frozen-lockfile && pnpm run build
        env:
          VITE_API_URL: https://api.orahdex.app

      - name: Deploy frontend to Cloudflare Pages
        run: |
          npx wrangler pages deploy artifacts/bsv-dex/dist \
            --project-name orahdex-app \
            --branch Main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test frontend
        run: |
          url="https://orahdex-app.pages.dev"
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "Frontend smoke test failed"; exit 1
