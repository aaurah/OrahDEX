name: OrahDEX D1 Staging Migration

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Select staging operation"
        required: true
        type: choice
        options:
          - verify
          - migrate
          - sample-import
          - batch-100
        default: verify

permissions:
  contents: read

concurrency:
  group: orahdex-d1-staging-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Wrangler
        working-directory: artifacts/orahdex-cloud-api
        run: npm install

      - name: Verify exact staging database
        working-directory: artifacts/orahdex-cloud-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          npx wrangler d1 list --json > /tmp/orahdex-d1-list.json

          node - <<'NODE'
          const fs = require("fs");
          const dbs = JSON.parse(
            fs.readFileSync("/tmp/orahdex-d1-list.json", "utf8")
          );
          const matches = dbs.filter(
            x => x.name === "orahdex-cloud-staging"
          );

          if (matches.length !== 1 ||
              matches[0].uuid !==
              "7cc7c3a8-5368-4328-a0bf-6c63ec8698d2") {
            throw Error("Staging database identity mismatch");
          }

          console.log("Exact staging database verified");
          NODE

      - name: Verify staging configuration
        working-directory: artifacts/orahdex-cloud-api
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          cfg = tomllib.loads(
              Path("wrangler.toml").read_text()
          )
          dbs = cfg["d1_databases"]

          assert len(dbs) == 1
          assert dbs[0]["binding"] == "DB"
          assert dbs[0]["database_name"] == "orahdex-cloud-staging"
          assert dbs[0]["database_id"] == \
              "7cc7c3a8-5368-4328-a0bf-6c63ec8698d2"

          print("Staging configuration verified")
          PY

      - name: Verify database
        if: inputs.operation == 'verify'
        working-directory: artifacts/orahdex-cloud-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute orahdex-cloud-staging \
            --remote \
            --command="SELECT COUNT(*) AS total FROM markets;"

      - name: Apply staging migration
        if: inputs.operation == 'migrate'
        working-directory: artifacts/orahdex-cloud-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          npx wrangler d1 execute orahdex-cloud-staging \
            --remote \
            --file=migrations/0001_markets.sql

          npx wrangler d1 execute orahdex-cloud-staging \
            --remote \
            --command="SELECT COUNT(*) AS total FROM markets;"

      - name: Import five sample markets
        if: inputs.operation == 'sample-import'
        working-directory: artifacts/orahdex-cloud-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SAMPLE_SQL: ${{ secrets.ORAHDEX_D1_SAMPLE_SQL }}
        run: |
          set -euo pipefail

          test -n "$SAMPLE_SQL" || {
            echo "Missing sample secret"
            exit 1
          }

          umask 077
          printf '%s\n' "$SAMPLE_SQL" > /tmp/markets-sample.sql
          unset SAMPLE_SQL

          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          sql = Path("/tmp/markets-sample.sql").read_text()
          migration = Path(
              "migrations/0001_markets.sql"
          ).read_text()

          db = sqlite3.connect(":memory:")
          db.executescript(migration)
          db.executescript(sql)

          rows = db.execute(
              "SELECT symbol FROM markets"
          ).fetchall()

          assert len(rows) == 5
          assert len({r[0] for r in rows}) == 5
          assert sql.count("INSERT INTO markets") == 5

          print("Five unique market records validated")
          PY

          npx wrangler d1 execute orahdex-cloud-staging \
            --remote --json \
            --command="SELECT COUNT(*) AS total FROM markets;" \
            > /tmp/orahdex-before.json

          python3 - <<'PY'
          import json

          data = json.load(open("/tmp/orahdex-before.json"))

          assert len(data) == 1
          assert data[0]["success"] is True
          assert data[0]["results"][0]["total"] == 0

          print("Remote market table empty")
          PY

          npx wrangler d1 execute orahdex-cloud-staging \
            --remote \
            --file=/tmp/markets-sample.sql

          npx wrangler d1 execute orahdex-cloud-staging \
            --remote --json \
            --command="SELECT COUNT(*) AS total FROM markets;" \
            > /tmp/orahdex-after.json

          python3 - <<'PY'
          import json

          data = json.load(open("/tmp/orahdex-after.json"))

          assert len(data) == 1
          assert data[0]["success"] is True
          assert data[0]["results"][0]["total"] == 5

          print("SUCCESS: Five staging markets imported")
          PY

      - name: Import 100 staging markets
        if: inputs.operation == 'batch-100'
        working-directory: artifacts/orahdex-cloud-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PART_1: ${{ secrets.ORAHDEX_D1_BATCH_1 }}
          PART_2: ${{ secrets.ORAHDEX_D1_BATCH_2 }}
          PART_3: ${{ secrets.ORAHDEX_D1_BATCH_3 }}
          PART_4: ${{ secrets.ORAHDEX_D1_BATCH_4 }}
          PART_5: ${{ secrets.ORAHDEX_D1_BATCH_5 }}
        run: |
          set -euo pipefail
          umask 077

          python3 - <<'PYCODE'
          import os, hashlib, sqlite3
          from pathlib import Path

          chunks = []
          for i in range(1, 6):
              value = os.environ.get(f"PART_{i}", "")
              assert value.strip(), f"Missing batch secret {i}"
              lines = value.splitlines()
              assert len(lines) == 20
              assert all(
                  line.startswith("INSERT INTO markets ")
                  and "ON CONFLICT(symbol)" in line
                  for line in lines
              )
              chunks.extend(lines)

          sql = "\n".join(chunks) + "\n"
          expected = (
              "bb4c1f8d8fcea3979dec6346cc0d68d333"
              "c4881c1741037f6b65695a29023c1d"
          )
          assert hashlib.sha256(sql.encode()).hexdigest() == expected
          assert len(chunks) == 100

          db = sqlite3.connect(":memory:")
          db.executescript(
              Path("migrations/0001_markets.sql").read_text()
          )
          db.executescript(sql)
          assert db.execute(
              "SELECT COUNT(*) FROM markets"
          ).fetchone()[0] == 100

          db.executescript(sql)
          assert db.execute(
              "SELECT COUNT(*) FROM markets"
          ).fetchone()[0] == 100

          Path("/tmp/orahdex-batch-100.sql").write_text(sql)
          print("100-record checksum and UPSERT validation: PASS")
          PYCODE

          npx wrangler d1 execute orahdex-cloud-staging \
            --remote --json \
            --command="SELECT COUNT(*) AS total FROM markets;" \
            > /tmp/orahdex-batch-before.json

          python3 - <<'PYCODE'
          import json
          data = json.load(open("/tmp/orahdex-batch-before.json"))
          assert len(data) == 1
          assert data[0]["success"] is True
          assert data[0]["results"][0]["total"] == 5
          print("Staging pre-import count: 5")
          PYCODE

          npx wrangler d1 execute orahdex-cloud-staging \
            --remote \
            --file=/tmp/orahdex-batch-100.sql

          npx wrangler d1 execute orahdex-cloud-staging \
            --remote --json \
            --command="SELECT COUNT(*) AS total FROM markets;" \
            > /tmp/orahdex-batch-after.json

          python3 - <<'PYCODE'
          import json
          data = json.load(open("/tmp/orahdex-batch-after.json"))
          assert len(data) == 1
          assert data[0]["success"] is True
          assert data[0]["results"][0]["total"] == 100
          print("SUCCESS: 100 staging markets verified")
          PYCODE

      - name: Remove temporary batch file
        if: always()
        run: rm -f /tmp/orahdex-batch-100.sql

      - name: Remove temporary sample file
        if: always()
        run: rm -f /tmp/markets-sample.sql
