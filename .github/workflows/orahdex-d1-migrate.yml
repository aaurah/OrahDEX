name: OrahDEX D1 Staging Migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orahdex-d1-staging-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Wrangler
        working-directory: artifacts/orahdex-cloud-api
        run: npm install

      - name: Verify exact staging database
        working-directory: artifacts/orahdex-cloud-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/orahdex-d1-list.json
          node - <<'NODE'
          const fs = require("fs");
          const dbs = JSON.parse(
            fs.readFileSync("/tmp/orahdex-d1-list.json", "utf8")
          );
          const db = dbs.find(
            x => x.name === "orahdex-cloud-staging"
          );
          if (!db ||
              db.uuid !== "7cc7c3a8-5368-4328-a0bf-6c63ec8698d2") {
            throw Error("Staging database identity mismatch");
          }
          console.log("Staging database verified");
          NODE

      - name: Apply staging migration
        working-directory: artifacts/orahdex-cloud-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute orahdex-cloud-staging \
            --remote \
            --file=migrations/0001_markets.sql

      - name: Verify market schema
        working-directory: artifacts/orahdex-cloud-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute orahdex-cloud-staging \
            --remote \
            --command="SELECT COUNT(*) AS total FROM markets;"
