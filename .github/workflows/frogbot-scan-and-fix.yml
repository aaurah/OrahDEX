# Frogbot Scan and Fix
# Automatically creates pull requests with fixes for vulnerable project dependencies.
# Requires JFrog Xray — configure JF_URL and JF_ACCESS_TOKEN in repo secrets.
# Docs: https://docs.jfrog-applications.jfrog.io/jfrog-applications/frogbot

name: "Frogbot Scan and Fix"
on:
  push:
    branches: [ "replit-agent" ]
permissions:
  contents: write
  pull-requests: write
  security-events: write
jobs:
  create-fix-pull-requests:
    runs-on: ubuntu-latest
    # Skip the entire job (→ workflow passes) when JFrog credentials are absent.
    if: >
      (secrets.JF_URL != '' || vars.JF_URL != '') &&
      (secrets.JF_ACCESS_TOKEN != '' || secrets.JFROG_ACCESS_TOKEN != '')
    steps:
      - uses: actions/checkout@v4

      - uses: jfrog/frogbot@5d9c42c30f1169d8be4ba5510b40e75ffcbbc2a9  # v2.21.2
        env:
          # JFrog platform URL (secret takes precedence over repo variable)
          JF_URL: ${{ secrets.JF_URL || vars.JF_URL }}

          # JFrog access token with 'read' permissions on Xray service
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN || secrets.JFROG_ACCESS_TOKEN }}

          # GitHub token for opening fix PRs
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
