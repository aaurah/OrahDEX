name: OrahDEX Cloud API

on:
  push:
    branches:
      - feature/orahdex-cloud-api
    paths:
      - "artifacts/orahdex-cloud-api/**"
      - ".github/workflows/orahdex-cloud-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: artifacts/orahdex-cloud-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run check

      - name: Deploy staging Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
