name: OrahDEX Cloudflare Pages

on:
  push:
    branches:
      - Main
  pull_request:
    branches:
      - Main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build OrahDEX frontend
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_REOWN_PROJECT_ID: ${{ vars.VITE_REOWN_PROJECT_ID }}
        run: pnpm --filter @workspace/bsv-dex build

      - name: Verify build
        run: |
          test -f artifacts/bsv-dex/dist/public/index.html

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: orahdex-frontend
          path: artifacts/bsv-dex/dist/public/
          retention-days: 7

      - name: Deploy Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/Main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_PAGES_PROJECT"

          npx --yes wrangler@4 pages deploy \
            artifacts/bsv-dex/dist/public \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch=Main
