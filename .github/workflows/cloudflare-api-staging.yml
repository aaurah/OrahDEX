name: OrahDEX Cloud API (staging)

on:
  workflow_dispatch:
    inputs:
      confirm_staging:
        description: Apply the additive migration to staging D1 and deploy the Cloudflare Worker
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-api-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: inputs.confirm_staging == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify Worker and orderbook tests
        run: |
          pnpm --filter orahdex-cloud-api check
          pnpm --filter orahdex-cloud-api test

      - name: Validate deployment bundle
        run: pnpm --filter orahdex-cloud-api exec wrangler deploy --dry-run

      - name: Apply additive staging D1 migrations
        working-directory: artifacts/orahdex-cloud-api
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm exec wrangler d1 migrations apply orahdex-cloud-staging --remote

      - name: Deploy staging Worker
        working-directory: artifacts/orahdex-cloud-api
        run: pnpm exec wrangler deploy
