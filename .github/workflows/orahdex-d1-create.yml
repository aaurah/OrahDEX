name: OrahDEX D1 Staging Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-database:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: artifacts/orahdex-cloud-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Check existing D1 databases
        run: npx wrangler d1 list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create staging database if missing
        run: |
          if npx wrangler d1 list --json | \
             node -e '
               let s="";
               process.stdin.on("data", x => s+=x);
               process.stdin.on("end", () => {
                 const dbs=JSON.parse(s);
                 process.exit(
                   dbs.some(x => x.name === "orahdex-cloud-staging")
                     ? 0 : 1
                 );
               });
             '
          then
            echo "Staging database already exists"
          else
            npx wrangler d1 create orahdex-cloud-staging
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
