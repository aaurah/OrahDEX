name = "orahdex"
main = "./worker.js"
compatibility_date = "2026-07-30"
workers_dev = true

routes = [
  { pattern = "orahdex.com", custom_domain = true },
  { pattern = "orahdex.org", custom_domain = true },
  { pattern = "tradeora.app", custom_domain = true }
]

[[kv_namespaces]]
binding = "ORAHDEX_KV"
id = "8dd2e276f6944b1aa06548efb4294d06"

[[d1_databases]]
binding = "ORAHDEX_DB"
database_name = "orahdex"
database_id = "d751fe1d-70f7-4761-8c3a-0a73c93c010a"

[assets]
directory = "./dist/public"
not_found_handling = "single-page-application"

[triggers]
crons = ["* * * * *"]
